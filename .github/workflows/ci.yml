name: CI

# Phase 0 baseline pipeline (tasks.md). Purpose: reproducible verification
# that the repository builds and its test suite passes — not deployment.
# Do not add deploy/release steps here; that belongs to a later phase.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # go.mod is the single source of truth for the Go toolchain version.
  GO_VERSION_FILE: go.mod

jobs:
  fmt-vet-build:
    name: gofmt / go vet / go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: gofmt (must produce no output)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: dependency integrity (go.mod/go.sum must already be tidy)
        run: |
          cp go.mod /tmp/go.mod.orig
          cp go.sum /tmp/go.sum.orig
          go mod tidy
          diff -u /tmp/go.mod.orig go.mod
          diff -u /tmp/go.sum.orig go.sum

  test:
    name: go test (unit + PostgreSQL + Redis integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: awo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://admin:admin@localhost:5432/awo?sslmode=disable
      TEST_DATABASE_URL: postgres://admin:admin@localhost:5432/awo?sslmode=disable
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test ./... (includes real-PostgreSQL RLS + real-Redis integration tests)
        run: go test ./... -count=1 -coverprofile=coverage.out
      - name: coverage summary (reported, not gated — see tasks.md Phase 9)
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  race:
    name: go test -race (linux/amd64 — required, unsupported on android/arm64 dev hosts)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: awo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://admin:admin@localhost:5432/awo?sslmode=disable
      TEST_DATABASE_URL: postgres://admin:admin@localhost:5432/awo?sslmode=disable
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race ./...
        run: go test -race ./... -count=1
