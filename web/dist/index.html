<!DOCTYPE html>
<html lang="en" data-theme="system">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AWO ERP</title>
  <link rel="stylesheet" href="https://unpkg.com/amis@6.7.0/sdk/sdk.css">
  <link rel="stylesheet" href="https://unpkg.com/amis@6.7.0/sdk/helper.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/amis@6.7.0/sdk/iconfont.css">
  <style>
    :root {
      --sidebar-w: 240px;
      --topbar-h: 52px;
      --brand: #1e40af;
      --brand-dark: #1e3a8a;
      --sidebar-bg: #0f172a;
      --sidebar-text: #cbd5e1;
      --sidebar-hover: #1e293b;
      --sidebar-active-bg: #1e40af;
      --sidebar-active-text: #fff;
      --sidebar-group: #64748b;
      --topbar-bg: #fff;
      --topbar-border: #e2e8f0;
      --content-bg: #f8fafc;
      --footer-text: #94a3b8;
    }

    [data-theme="dark"] {
      --topbar-bg: #1e293b;
      --topbar-border: #334155;
      --content-bg: #0f172a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    #app { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .2s ease, min-width .2s ease;
      z-index: 50;
    }

    #sidebar.collapsed { width: 56px; min-width: 56px; }

    .sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      height: var(--topbar-h);
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }

    .brand-content { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--brand); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; flex-shrink: 0;
    }
    .brand-text { font-weight: 700; font-size: 15px; color: #f1f5f9; white-space: nowrap; overflow: hidden; }
    #sidebar.collapsed .brand-text { display: none; }

    .sidebar-toggle {
      background: none; border: none; color: var(--sidebar-group);
      cursor: pointer; padding: 6px; border-radius: 6px; flex-shrink: 0;
      font-size: 14px;
    }
    .sidebar-toggle:hover { background: var(--sidebar-hover); color: #fff; }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 0;
    }
    .sidebar-menu::-webkit-scrollbar { width: 4px; }
    .sidebar-menu::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .nav-group-label {
      padding: 12px 16px 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--sidebar-group);
      white-space: nowrap;
      overflow: hidden;
    }
    #sidebar.collapsed .nav-group-label { visibility: hidden; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 0;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 13.5px;
      transition: background .15s;
      white-space: nowrap;
      overflow: hidden;
    }
    .nav-item:hover { background: var(--sidebar-hover); color: #f1f5f9; }
    .nav-item.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); }
    .nav-item i { width: 18px; text-align: center; font-size: 13px; flex-shrink: 0; }
    .nav-item span { overflow: hidden; text-overflow: ellipsis; }
    #sidebar.collapsed .nav-item span { display: none; }

    /* ── Main ────────────────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--content-bg);
    }

    #topbar {
      height: var(--topbar-h);
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--topbar-border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 40;
    }

    .topbar-toggle {
      display: none;
      background: none; border: none; cursor: pointer;
      font-size: 16px; color: #64748b; padding: 6px;
    }

    .breadcrumb { font-size: 13px; color: #64748b; display: flex; align-items: center; gap: 6px; }
    .bc-sep { color: #cbd5e1; }
    .bc-current { color: #1e293b; font-weight: 500; }

    .topbar-spacer { flex: 1; }

    .topbar-right { display: flex; align-items: center; gap: 8px; }

    .user-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 10px; border-radius: 20px;
      background: #f1f5f9; font-size: 13px; color: #475569;
    }
    .user-badge i { color: #94a3b8; }

    .theme-btn {
      background: none; border: 1px solid #e2e8f0;
      border-radius: 6px; padding: 5px 10px;
      cursor: pointer; font-size: 12px; color: #64748b;
      display: flex; align-items: center; gap: 6px;
    }
    .theme-btn:hover { background: #f1f5f9; }

    #content {
      flex: 1;
      overflow: auto;
      padding: 20px;
      isolation: isolate;
    }

    .page-loading {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: #94a3b8; font-size: 14px; gap: 10px;
    }

    .page-error {
      margin: 40px auto; max-width: 480px; padding: 24px;
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 8px; color: #b91c1c; font-size: 14px;
    }
    .page-error h3 { margin-bottom: 8px; }

    #footer {
      padding: 8px 20px;
      font-size: 12px;
      color: var(--footer-text);
      border-top: 1px solid var(--topbar-border);
      background: var(--topbar-bg);
      flex-shrink: 0;
    }

    /* ── Login overlay ───────────────────────────────────────────────── */
    #login-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      display: flex; align-items: center; justify-content: center;
    }
    #login-overlay.hidden { display: none; }

    .login-card {
      background: #fff; border-radius: 16px; padding: 40px;
      width: 100%; max-width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,.4);
    }
    .login-logo {
      display: flex; align-items: center; gap: 12px; margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 44px; height: 44px; border-radius: 10px;
      background: var(--brand); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 20px;
    }
    .login-logo-text { font-size: 20px; font-weight: 700; color: #0f172a; }
    .login-logo-sub { font-size: 12px; color: #94a3b8; }

    .login-field { margin-bottom: 18px; }
    .login-field label {
      display: block; font-size: 13px; font-weight: 500;
      color: #374151; margin-bottom: 6px;
    }
    .login-field small { color: #94a3b8; font-weight: 400; }
    .login-field input {
      width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 14px; outline: none;
      transition: border-color .15s;
    }
    .login-field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(30,64,175,.1); }

    .login-btn {
      width: 100%; padding: 11px; background: var(--brand); color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .login-btn:hover { background: var(--brand-dark); }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }

    .login-error {
      margin-top: 14px; padding: 10px 12px; border-radius: 8px;
      background: #fef2f2; color: #b91c1c; font-size: 13px;
      display: none;
    }
    .login-error.visible { display: block; }

    /* ── Mobile ──────────────────────────────────────────────────────── */
    #sidebar-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 190;
    }

    @media (max-width: 768px) {
      #sidebar {
        position: fixed; top: 0; left: 0; bottom: 0;
        transform: translateX(-100%); transition: transform .25s ease;
        z-index: 200;
      }
      #sidebar.mobile-open { transform: translateX(0); width: var(--sidebar-w) !important; min-width: var(--sidebar-w) !important; }
      #sidebar-backdrop.visible { display: block; }
      .topbar-toggle { display: flex; }
      #main { width: 100%; }
      .brand-text { display: block !important; }
      .nav-item span { display: inline !important; }
    }
  </style>
</head>

<body>
  <!-- Login overlay — shown until a valid session is confirmed against the
       real backend (POST /api/v1/auth/login). There is no self-service
       workspace/tenant registration endpoint in the real backend today, so
       this form does not offer one — ask your administrator for your
       tenant ID. See examples/expense/DEMO.md for a disposable demo tenant
       and user you can create yourself. -->
  <div id="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">A</div>
        <div>
          <div class="login-logo-text">AWO ERP</div>
          <div class="login-logo-sub">Sign in to your workspace</div>
        </div>
      </div>

      <form id="login-form" onsubmit="submitLogin(event)">
        <div class="login-field">
          <label for="login-tenant">Tenant ID <small>(UUID — ask your administrator)</small></label>
          <input id="login-tenant" type="text" placeholder="00000000-0000-0000-0000-000000000000" autocomplete="off" required>
        </div>
        <div class="login-field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="login-field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button class="login-btn" type="submit" id="login-submit">Sign in</button>
        <div class="login-error" id="login-error"></div>
      </form>
    </div>
  </div>

  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-content">
          <div class="brand-icon">A</div>
          <span class="brand-text">AWO ERP</span>
        </div>
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
          <i class="fa fa-bars"></i>
        </button>
      </div>
      <nav class="sidebar-menu" id="sidebarMenu"></nav>
    </aside>

    <div id="sidebar-backdrop" onclick="closeMobile()"></div>

    <div id="main">
      <div id="topbar">
        <button class="topbar-toggle" onclick="openMobile()"><i class="fa fa-bars"></i></button>
        <div class="breadcrumb">
          <span id="bc-module"></span>
          <span class="bc-sep" id="bc-sep" style="display:none">›</span>
          <span class="bc-current" id="bc-page">Dashboard</span>
        </div>
        <div class="topbar-spacer"></div>
        <div class="topbar-right">
          <div class="user-badge" id="userBadge">
            <i class="fa fa-circle-user"></i>
            <span id="userName">—</span>
          </div>
          <button class="theme-btn" onclick="cycleTheme()">
            <i class="fa fa-circle-half-stroke" id="themeIcon"></i>
            <span id="themeLabel">System</span>
          </button>
          <button class="theme-btn" onclick="doLogout()" title="Sign out">
            <i class="fa fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>

      <div id="content">
        <div class="page-loading"><i class="fa fa-spinner fa-spin"></i> Loading...</div>
      </div>

      <div id="footer">&copy; 2026 AWO ERP</div>
    </div>
  </div>

  <script src="https://unpkg.com/amis@6.7.0/sdk/sdk.js"></script>
  <script src="https://unpkg.com/amis@6.7.0/sdk/charts.js"></script>
  <script src="https://unpkg.com/amis@6.7.0/sdk/rest.js"></script>
  <script>
  (function () {
    /* ── Config ─────────────────────────────────────────────────── */
    var API_BASE = '/api/v1';

    /* ── Theme ──────────────────────────────────────────────────── */
    var themes = ['system', 'light', 'dark'];
    var themeIdx = themes.indexOf(localStorage.getItem('awo-theme') || 'system');
    function applyTheme() {
      var t = themes[themeIdx];
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeLabel').textContent = t.charAt(0).toUpperCase() + t.slice(1);
      localStorage.setItem('awo-theme', t);
    }
    window.cycleTheme = function () { themeIdx = (themeIdx + 1) % themes.length; applyTheme(); };
    applyTheme();

    /* ── Sidebar collapse ────────────────────────────────────────── */
    var sidebar = document.getElementById('sidebar');
    var sidebarCollapsed = localStorage.getItem('awo-sidebar') === 'collapsed';
    if (sidebarCollapsed) sidebar.classList.add('collapsed');
    window.toggleSidebar = function () {
      sidebarCollapsed = !sidebarCollapsed;
      sidebar.classList.toggle('collapsed', sidebarCollapsed);
      localStorage.setItem('awo-sidebar', sidebarCollapsed ? 'collapsed' : '');
    };
    var backdrop = document.getElementById('sidebar-backdrop');
    window.openMobile = function () { sidebar.classList.add('mobile-open'); backdrop.classList.add('visible'); };
    window.closeMobile = function () { sidebar.classList.remove('mobile-open'); backdrop.classList.remove('visible'); };

    /* ── Session (real auth — R.11) ────────────────────────────────
       There is no self-service tenant/workspace registration endpoint in
       the real backend (platform/iam/handler.go registers only /login,
       /logout, /me) — this app only offers sign-in, never fabricates one. */
    var authToken = localStorage.getItem('awo-token') || '';
    var currentTenant = localStorage.getItem('awo-tenant') || '';
    var currentUser = localStorage.getItem('awo-user') || '';

    function authHeaders(extra) {
      var h = Object.assign({}, extra || {});
      if (authToken) h['Authorization'] = 'Bearer ' + authToken;
      if (currentTenant) h['X-Tenant-ID'] = currentTenant;
      return h;
    }
    function storeSession(token, tenantId, userId) {
      authToken = token; currentTenant = tenantId; currentUser = userId;
      localStorage.setItem('awo-token', token);
      localStorage.setItem('awo-tenant', tenantId);
      localStorage.setItem('awo-user', userId);
    }
    function clearSession() {
      authToken = ''; currentTenant = ''; currentUser = '';
      localStorage.removeItem('awo-token');
      localStorage.removeItem('awo-tenant');
      localStorage.removeItem('awo-user');
    }

    function showLogin(msg) {
      document.getElementById('login-overlay').classList.remove('hidden');
      document.getElementById('app').style.visibility = 'hidden';
      if (currentTenant) document.getElementById('login-tenant').value = currentTenant;
      var el = document.getElementById('login-error');
      if (msg) { el.textContent = msg; el.classList.add('visible'); }
      else { el.classList.remove('visible'); }
    }
    function hideLogin() {
      document.getElementById('login-overlay').classList.add('hidden');
      document.getElementById('app').style.visibility = '';
    }

    window.submitLogin = function (e) {
      e.preventDefault();
      var tenantId = document.getElementById('login-tenant').value.trim();
      var email = document.getElementById('login-email').value.trim();
      var pass = document.getElementById('login-password').value;
      var btn = document.getElementById('login-submit');
      var errEl = document.getElementById('login-error');

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errEl.classList.remove('visible');

      fetch(API_BASE + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: pass, tenant_id: tenantId })
      })
        .then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (body) {
            if (!r.ok || !body.data) {
              throw new Error((body.error && body.error.message) || 'Login failed');
            }
            return body.data;
          });
        })
        .then(function (data) {
          storeSession(data.token, data.tenant_id, data.user_id);
          return startApp();
        })
        .catch(function (err) {
          errEl.textContent = err.message;
          errEl.classList.add('visible');
        })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = 'Sign in';
        });
    };

    window.doLogout = function () {
      clearSession();
      window.location.href = '/ui';
      window.location.reload();
    };

    function loadUserBadge() {
      fetch(API_BASE + '/iam/users/' + currentUser, { headers: authHeaders() })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (body) {
          var name = (body && body.data && (body.data.full_name || body.data.email)) || currentUser;
          document.getElementById('userName').textContent = name;
        })
        .catch(function () {
          document.getElementById('userName').textContent = currentUser;
        });
    }

    /* ── Navigation (real, fetched from the backend — not hardcoded) ──
       GET /api/v1/ui/nav returns the actual registered entities for this
       deployment; see docs/00-overview/.../ §B.11. Every href below is one
       of the backend's own "/ui/{module}/{entity}" listUrl values. */
    var NAV_FLAT = [];

    function renderNav(groups) {
      var menu = document.getElementById('sidebarMenu');
      menu.innerHTML = '';
      NAV_FLAT = [];
      (groups || []).forEach(function (group) {
        var label = document.createElement('div');
        label.className = 'nav-group-label';
        label.textContent = group.label;
        menu.appendChild(label);
        (group.entries || []).forEach(function (entry) {
          var a = document.createElement('a');
          a.className = 'nav-item';
          a.href = entry.listUrl;
          a.innerHTML = '<i class="fa fa-circle-dot"></i><span>' + entry.label + '</span>';
          a.addEventListener('click', function () { closeMobile(); });
          menu.appendChild(a);
          NAV_FLAT.push({ label: entry.label, href: entry.listUrl, module: group.label });
        });
      });
    }

    function loadNav() {
      return fetch(API_BASE + '/ui/nav', { headers: authHeaders() })
        .then(function (r) {
          if (!r.ok) throw new Error('failed to load navigation (HTTP ' + r.status + ')');
          return r.json();
        })
        .then(renderNav);
    }

    /* ── AMIS setup ─────────────────────────────────────────────── */
    var amis = amisRequire('amis/embed');
    var currentInstance = null;

    // R.14 follow-up — the actual bug behind "Save appears to succeed but
    // the form never navigates away": this function's previous shape,
    // `{status, msg, data}`, is NOT amis's real fetcher contract (that was
    // a carried-over assumption from the pre-R.11 static shell's own stale
    // comment, never checked against amis's actual source). Confirmed by
    // reading amis v6.7.0's real, shipped response normalizer (the
    // minified function amis-core calls `k` in api.js, reached via
    // wrapFetcher -> wrapAdaptor): it reads `a = <what this function
    // returns>.data`, then derives success as
    // `ok = (false === !a.hasOwnProperty('status')) || (0 == a.status)`.
    // Returning `{status:0, data: record}` makes `a` the raw business
    // record — and because our own entities commonly have their own
    // "status" field (e.g. Expense's draft/submitted/approved), amis's
    // normalizer mistook a real business field for amis's OWN
    // success/failure code, with a non-zero/non-numeric value, and treated
    // EVERY submission as a failure — confirmed by executing the real,
    // unmodified amis SDK (see web/form-navigation.test.cjs).
    //
    // The actually-correct contract: the object this function returns must
    // have NO top-level "status" property of its own; amis's normalizer
    // then falls back to inspecting error.code/error.message directly on
    // the backend's OWN response body — which happens to already match
    // Awo's real {error:{code,message}} shape natively. So: pass the raw
    // backend body straight through for anything that isn't a list (lists
    // need reshaping into {items,total} to match the generated schema's
    // own itemsKey:"items" configuration).
    function adaptResponse(body) {
      if (body && Array.isArray(body.data)) {
        return { data: { items: body.data, total: (body.meta && body.meta.total) || body.data.length } };
      }
      return { data: body };
    }

    var amisEnv = {
      locale: 'en-US',
      fetcher: function (api) {
        var url = api.url || '';
        var method = (api.method || 'get').toLowerCase();

        // AMIS's crud component defaults to perPage; our backend's List
        // handler reads page_size (api/handler/crud.go) — translate.
        var urlObj = new URL(url, window.location.origin);
        var perPage = urlObj.searchParams.get('perPage') || urlObj.searchParams.get('$perPage');
        if (perPage !== null) {
          urlObj.searchParams.delete('perPage');
          urlObj.searchParams.delete('$perPage');
          urlObj.searchParams.set('page_size', perPage);
        }
        url = urlObj.toString();

        var headers = authHeaders(Object.assign({ 'Content-Type': 'application/json' }, api.headers || {}));
        var opts = { method: method, headers: headers };
        if (method !== 'get' && method !== 'head' && api.data !== undefined) {
          opts.body = JSON.stringify(api.data);
        }

        return fetch(url, opts)
          .then(function (res) {
            if (res.status === 204) return { data: {} };
            return res.json().catch(function () { return {}; }).then(function (body) {
              return adaptResponse(body);
            });
          })
          .catch(function (err) {
            // No top-level "status" here either, for the same reason —
            // amis's own error.code/error.message heuristic (confirmed
            // from source) is what recognizes this as a failure.
            return { data: { error: { code: 'network_error', message: 'Network error: ' + err.message } } };
          });
      },
      isCancel: function () { return false; },
      notify: function (type, msg) {
        console.log('[amis:' + type + ']', msg);
      },
      alert: window.alert.bind(window),
      copy: function (text) {
        if (navigator.clipboard) navigator.clipboard.writeText(text);
      },
      // Route amis's own internal link/jump/redirect navigation (e.g. the
      // backend-generated "New Expense" header button, "View"/"Edit" row
      // actions) through our SPA router instead of a full page load.
      jumpTo: function (to) {
        if (typeof to === 'string' && to.indexOf('/ui/') === 0) {
          navigateTo(to);
        } else {
          window.location.href = to;
        }
      }
    };

    /* ── Schema loading from the REAL backend (R.11) ─────────────────
       Previously fetched static mock files under /schemas/pages/*.json;
       now calls the live GET /api/v1/ui/{module}/{entity}[/{id}][/create|
       /edit] endpoint directly — the same one the SDUI engine serves for
       every registered entity, Expense included. */
    function loadSchema(path) {
      return fetch(API_BASE + '/ui/' + path, { headers: authHeaders() })
        .then(function (r) {
          if (!r.ok) {
            return r.json().catch(function () { return {}; }).then(function (b) {
              throw new Error((b.error && b.error.message) || ('HTTP ' + r.status));
            });
          }
          return r.json();
        });
    }

    // A required, disabled, remote-sourced field with no default value
    // can't be filled in through a pure create form (the generic SDUI
    // generator marks "actor-like" Link fields disabled, assuming some
    // other mechanism supplies a default — none exists for a brand-new
    // record yet). Only applies to a form with no initApi (genuinely
    // creating, not editing an existing record whose initApi already
    // supplies the value) — generic, matches on schema shape only, not any
    // specific field or entity name.
    function makeCreateFormFieldsEditable(schema) {
      if (!schema || !Array.isArray(schema.body)) return schema;
      schema.body.forEach(function (node) {
        if (node && node.type === 'form' && !node.initApi && Array.isArray(node.body)) {
          node.body.forEach(function (field) {
            if (field && field.disabled && field.required && field.source) {
              field.disabled = false;
            }
          });
        }
      });
      return schema;
    }

    // Create/edit form lifecycle fix: the generic SDUI generator emits a
    // create/edit form's "api" (what to submit to) but no "redirect" (where
    // to go afterward) — a page-routing decision the backend's generic
    // schema generator can't know and shouldn't encode. Without it, amis
    // leaves a successfully-submitted form exactly as-is: still on screen,
    // still holding the just-submitted values, with no visible confirmation
    // that anything happened — inviting a second, duplicate "Save" click.
    // amis's own Form component (confirmed directly in its shipped SDK
    // source, not just documentation) calls env.jumpTo(filter(redirect,
    // data), ...) ONLY after a submit's remote call actually resolves
    // successfully — never on a validation/network/server failure, where
    // the form's entered values are left untouched for the user to fix and
    // resubmit. Setting "redirect" here is therefore sufficient, on its
    // own, to satisfy both "successful create/edit navigates away and
    // leaves nothing stale behind" and "failed create/edit preserves
    // entered input" — no extra success/failure branching is needed in our
    // own code. Our own amisEnv.jumpTo then performs an SPA-style
    // navigation (not a full page reload), and because render() always
    // unmounts the current amis instance and fetches a fresh schema for the
    // new path, re-opening the create form afterward starts from a brand
    // new, clean, backend-returned schema — no stale field values can
    // persist across that boundary.
    //
    // Fully generic — computed from the current path's own "/create"/
    // "/edit" suffix, not any specific entity or module name, so it applies
    // identically to every entity this frontend ever loads a form for:
    //   .../{module}/{entity}/create      -> back to .../{module}/{entity}            (the list)
    //   .../{module}/{entity}/{id}/edit    -> back to .../{module}/{entity}/{id}        (the detail view)
    // Never overwrites a redirect the backend's schema already specifies,
    // so this stays forward-compatible if the generator starts emitting
    // its own.
    function applyFormPostSubmitNavigation(schema, path) {
      if (!schema || !Array.isArray(schema.body)) return schema;
      var target = null;
      if (/\/create$/.test(path)) {
        target = '/ui/' + path.replace(/\/create$/, '');
      } else if (/\/edit$/.test(path)) {
        target = '/ui/' + path.replace(/\/edit$/, '');
      }
      if (!target) return schema;
      schema.body.forEach(function (node) {
        if (node && node.type === 'form' && node.api && !node.redirect) {
          node.redirect = target;
        }
      });
      return schema;
    }

    /* ── Router — real path-based routing, matching the backend's own
       generated hrefs (e.g. "/ui/business/expenses/${id}") ──────────── */
    var content = document.getElementById('content');

    function schemaPathFromLocation() {
      return window.location.pathname.replace(/^\/ui\/?/, '').replace(/\/$/, '');
    }

    // R.14 follow-up — a second, independently-confirmed bug (via the same
    // real-amis-SDK execution test): detail and edit schemas' own
    // "${id}" template references (e.g. initApi:"GET:.../business/expenses/
    // ${id}") never resolved, because nothing supplied an "id" into the
    // embedded instance's own top-level data scope — confirmed from amis's
    // real embed() source that this is set via the loaded schema's own
    // top-level "data" property (object merge against the current scope),
    // not the props argument passed to amis.embed(). Without it, the edit
    // form's initApi silently requested ".../business/expenses/" (no id),
    // so the form rendered with every field blank, and clicking Save then
    // failed client-side validation before ever reaching the server -
    // exactly matching "Edit: navigation behaves unexpectedly."
    //
    // Generic — derived purely from the path's own shape
    // (.../{module}/{entity}/{id} or .../{module}/{entity}/{id}/edit),
    // never an entity/module name.
    function recordIdFromPath(path) {
      var parts = path.split('/').filter(Boolean);
      if (parts.length === 4 && parts[3] === 'edit') return parts[2];
      if (parts.length === 3 && parts[2] !== 'create') return parts[2];
      return undefined;
    }

    function setActive(path) {
      var full = '/ui/' + path;
      document.querySelectorAll('.nav-item').forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('href') === full);
      });
      var match = NAV_FLAT.find(function (n) { return n.href === full; });
      if (match) {
        document.getElementById('bc-module').textContent = match.module;
        document.getElementById('bc-sep').style.display = '';
        document.getElementById('bc-page').textContent = match.label;
      } else {
        document.getElementById('bc-module').textContent = '';
        document.getElementById('bc-sep').style.display = 'none';
        document.getElementById('bc-page').textContent = path || 'Home';
      }
    }

    function render() {
      var path = schemaPathFromLocation();
      setActive(path);

      if (currentInstance) {
        try { currentInstance.unmount(); } catch (e) {}
        currentInstance = null;
      }

      if (!path) {
        content.innerHTML = '<div class="page-loading">Select an entity from the sidebar.</div>';
        return;
      }

      content.innerHTML = '<div class="page-loading"><i class="fa fa-spinner fa-spin"></i> Loading...</div>';

      loadSchema(path)
        .then(function (schema) {
          schema = makeCreateFormFieldsEditable(schema);
          schema = applyFormPostSubmitNavigation(schema, path);
          var recordId = recordIdFromPath(path);
          if (recordId !== undefined) {
            schema.data = Object.assign({}, schema.data, { id: recordId });
          }
          content.innerHTML = '';
          currentInstance = amis.embed('#content', schema,
            { locale: 'en-US', tenant_id: currentTenant, user_id: currentUser, id: recordId }, amisEnv);
        })
        .catch(function (err) {
          content.innerHTML = '<div class="page-error"><h3>Could not load this page</h3><p>' + err.message + '</p></div>';
        });
    }

    function navigateTo(href) {
      if (window.location.pathname !== href) {
        history.pushState(null, '', href);
      }
      render();
    }

    // Intercept clicks on same-origin "/ui/..." links — both our own
    // sidebar nav and every link amis itself renders from the backend's
    // generated schemas (the "New Expense" header button, "View"/"Edit" row
    // actions) — so navigation is a real SPA transition, not a full reload.
    document.addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target.closest('a');
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (href !== '/ui' && href.slice(0, 4) !== '/ui/') return;
      e.preventDefault();
      navigateTo(href);
    });
    window.addEventListener('popstate', render);

    /* ── Startup ─────────────────────────────────────────────────── */
    function startApp() {
      hideLogin();
      loadUserBadge();
      return loadNav().then(render).catch(function (err) {
        content.innerHTML = '<div class="page-error"><h3>Could not load navigation</h3><p>' + err.message + '</p></div>';
      });
    }

    function checkSessionAndStart() {
      if (!authToken || !currentTenant) { showLogin(); return; }
      fetch(API_BASE + '/auth/me', { headers: authHeaders() })
        .then(function (r) {
          if (!r.ok) throw new Error('session expired');
          return startApp();
        })
        .catch(function () {
          clearSession();
          showLogin('Session expired — please sign in again.');
        });
    }

    checkSessionAndStart();
  })();
  </script>
</body>
</html>
